name: Pages

# Builds the documentation site from site/ and the tool registry, and deploys
# it to GitHub Pages. Needs Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'src/tools/**'
      - 'src/prompts/**'
      - 'README.md'
      # tools.json carries the package version.
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The engines floor's major (package.json: >=22.14.0).
          node-version: '22'

      # No install scripts: the build is tsc only, and the site build imports
      # the tool registry without loading better-sqlite3 or pg.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript
        run: npm run build

      - name: Build site
        run: node scripts/build-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    name: Deploy
    needs: build
    # Defence in depth beside the github-pages environment's branch policy:
    # a workflow_dispatch from any other branch builds but never deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Runs no repository code: it only publishes the artifact from the build job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
