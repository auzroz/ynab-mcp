            ### Verify

            Every file attached below is listed in `SHA256SUMS` and has a build
            provenance attestation from this repository's release workflow. The
            npm tarball and the image also have a signed SPDX SBOM attestation of
            the production npm dependencies (the image's OS packages are only in
            its unsigned BuildKit SBOM). For the image, the attestation is the
            proof of origin, not the ghcr tag, so verify it:
            ```bash
            # Checks every file you downloaded. Prints "Checksums OK" only if all of
            # them match and the npm tarball is one of them.
            sums=$(sha256sum --check --ignore-missing SHA256SUMS); ok=$?; printf '%s\n' "$sums"
            [ "$ok" -eq 0 ] && grep -qx 'ynab-mcp-${{ env.VERSION }}.tgz: OK' <<<"$sums" && echo "Checksums OK"
            gh attestation verify ynab-mcp-${{ env.VERSION }}.tgz -R ${{ github.repository }} \
              --signer-workflow ${{ github.repository }}/.github/workflows/release.yml --source-ref ${{ github.ref }}
            gh attestation verify oci://ghcr.io/${{ github.repository }}:${{ env.VERSION }} -R ${{ github.repository }} \
              --signer-workflow ${{ github.repository }}/.github/workflows/release.yml --source-ref ${{ github.ref }}
            ```
