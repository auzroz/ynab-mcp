name: Release

# Three ways in, one publish path:
# - A `v*.*.*` tag push is a release. Every publish job is guarded by the literal
#   `if:` "a tag push in auzroz/ynab-mcp". The docker and npm jobs wait for an
#   approval on the `production` environment, and only publish jobs hold
#   `id-token: write`. Nothing publishes before `verify` has proven the tagged
#   commit is on main or a release/* branch.
#   npm enforces the environment server side once its trusted publisher names
#   `production` (admin checklist in scripts/release-rehearsal.md). ghcr does
#   not: any workflow run in this repository that is granted `packages: write`
#   can push the image, approval or not. The image's proof of origin is its
#   attestation (`gh attestation verify --source-ref refs/tags/v...`). See
#   CONTRIBUTING.md "What the gate does not cover".
# - A pull request that touches the release inputs runs verify, test, build and
#   pack, and the image build for amd64 and arm64 with a better-sqlite3 load
#   check. Those jobs use no environment, no id-token, and `contents: read`.
# - workflow_dispatch (`dry_run`, default true) runs the same jobs as a pull
#   request on the chosen ref. It never publishes; `dry_run: false` is refused.
#
# Release procedure, approvals and verification: CONTRIBUTING.md "Releases".
# Scratch-repo rehearsal of the tag path: scripts/release-rehearsal.md.

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package*.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, pack and build the images without publishing. Must stay true: only a tag push publishes.'
        type: boolean
        required: true
        default: true

concurrency:
  # Tag pushes share one group, so two releases never run at once, and a run
  # in progress is never cancelled. GitHub keeps only one pending run per
  # group: if a third tag is pushed while one run is in progress and another
  # waits, the waiting run is cancelled before it starts (re-run it from its
  # run page). Pull request and dispatch runs cancel the superseded run for the
  # same ref.
  group: ${{ github.event_name == 'push' && 'release-publish' || format('release-check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: 'Release: Verify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Refuse a publishing dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          echo "::error::workflow_dispatch only runs dry. A release publishes only from a v*.*.* tag push in auzroz/ynab-mcp."
          exit 1

      # Full history and every branch, for the ancestry check below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Read package version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::package.json version '$version' is not a plain semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every event, so a pull request or the dry run on main catches a version
      # mismatch that a tag push would refuse after the tag already exists.
      - name: Verify package-lock.json and server.json carry the package.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const v=process.argv[1];const l=require('./package-lock.json');const s=require('./server.json');const bad=[];if(l.version!==v)bad.push('package-lock.json version '+l.version);if(!l.packages||!l.packages['']||l.packages[''].version!==v)bad.push('package-lock.json root package '+(l.packages&&l.packages['']&&l.packages[''].version));if(s.version!==v)bad.push('server.json version '+s.version);const ps=s.packages||[];if(!ps.length)bad.push('server.json has no packages');for(const p of ps){const pv=p.registryType==='oci'?String(p.identifier).split(':').pop():p.version;if(pv!==v)bad.push('server.json '+p.registryType+' '+pv);}if(bad.length){console.error('::error::package.json is '+v+' but: '+bad.join(', '));process.exit(1);}console.log('package.json, package-lock.json and server.json all carry '+v);" "$VERSION"

      - name: Verify tag matches package.json
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      # Anyone with push rights can create a tag on any commit. Only a commit
      # that is already on main or a release/* branch may be released. This is
      # only as strong as the rulesets on those branches: main requires a PR,
      # and release/** must require a PR AND restrict creations, or anyone with
      # Contents write can create release/x at their own commit. See the admin
      # checklist in scripts/release-rehearsal.md.
      - name: Verify the tagged commit is on main or a release branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          tagged="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [ "$commit" != "$tagged" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} now points at $tagged, but this run was started for $commit"
            exit 1
          fi
          found=""
          while IFS= read -r ref; do
            case "$ref" in
              refs/remotes/origin/main|refs/remotes/origin/release/*) ;;
              *) continue ;;
            esac
            if git merge-base --is-ancestor "$commit" "$ref"; then
              echo "Tagged commit $commit is on ${ref#refs/remotes/origin/}"
              found="$ref"
              break
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/main refs/remotes/origin/release)
          if [ -z "$found" ]; then
            echo "::error::Tagged commit $commit is not on main or any release/* branch. Refusing to release."
            exit 1
          fi

  test:
    name: 'Release: Test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No dependency cache on the tag path: a release installs only from
          # the lockfile and the registry. Checks still use the cache.
          cache: ${{ github.event_name != 'push' && 'npm' || '' }}

      - name: Check lockfile policy
        # Zero-dependency, so it runs before npm ci can install (and run scripts from) a non-registry entry.
        run: node scripts/check-lockfile.mjs

      # No dependency runs code at install time. better-sqlite3 loads the
      # prebuild shipped in its npm tarball; esbuild and fsevents are dev-only.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build:
    name: 'Release: Build and pack'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    # No id-token: this job runs the build and holds no publishing identity.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No dependency cache on the tag path: a release installs only from
          # the lockfile and the registry. Checks still use the cache.
          cache: ${{ github.event_name != 'push' && 'npm' || '' }}

      - name: Check lockfile policy
        # Zero-dependency, so it runs before npm ci can install (and run scripts from) a non-registry entry.
        run: node scripts/check-lockfile.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify better-sqlite3 loads from its prebuild
        run: node -e "new (require('better-sqlite3'))(':memory:').close()"

      - name: Build
        run: npm run build

      - name: Pack npm tarball
        run: |
          set -euo pipefail
          mkdir -p release-dist
          npm pack --ignore-scripts --pack-destination release-dist
          tarball="release-dist/ynab-mcp-${VERSION}.tgz"
          test -f "$tarball"
          # List to a file first: grep -q exits on the first match, and tar's
          # SIGPIPE would then fail the step under pipefail.
          tar -tzf "$tarball" > "$RUNNER_TEMP/pack-contents.txt"
          grep -qx 'package/dist/index.js' "$RUNNER_TEMP/pack-contents.txt"

      # SBOM of the production dependency tree pinned by package-lock.json: the
      # tree the Docker image installs. npm consumers resolve their own tree
      # within the same semver ranges.
      - name: Generate SBOM
        run: npm sbom --omit=dev --sbom-format spdx --package-lock-only > "release-dist/ynab-mcp-${VERSION}.spdx.json"

      - name: Package skills
        run: |
          set -euo pipefail
          cd skills
          # One bundle with every skill folder at the top level (no wrapper dir),
          # for dropping straight into a skills directory.
          zip -qr "../release-dist/ynab-mcp-skills-v${VERSION}.zip" . -x 'README.md' -x '*.DS_Store'
          # One zip per skill, for Claude.ai's one-at-a-time upload flow.
          for dir in */; do
            name="$(basename "$dir")"
            zip -qr "../release-dist/${name}.zip" "${name}" -x '*.DS_Store'
          done

      - name: Write SHA256SUMS
        working-directory: release-dist
        run: |
          set -euo pipefail
          sha256sum -- *.tgz *.spdx.json *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: release-dist/
          if-no-files-found: error
          # The publish jobs and any re-run of them download this artifact. An
          # approval can wait up to 30 days, so keep it longer than that.
          retention-days: 90

  image:
    name: 'Release: Image (${{ matrix.platform }})'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: x64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same Dockerfile as the publish job, one platform at a time, without
      # cache, loaded into the local daemon instead of pushed.
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ynab-mcp:release-check

      - name: Verify better-sqlite3 loads in the image
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform "$PLATFORM" --entrypoint node ynab-mcp:release-check -e "if(process.arch!==process.argv[1]){console.error('expected '+process.argv[1]+', got '+process.arch);process.exit(1)}const D=require('better-sqlite3');const db=new D(':memory:');console.log('better-sqlite3 (SQLite '+db.prepare('select sqlite_version() v').get().v+') loads on '+process.platform+'-'+process.arch);db.close()" "$ARCH"

  # Publish jobs. Each runs only for a tag push in auzroz/ynab-mcp, after
  # verify, test, build and both image checks passed. The docker job and then
  # the npm job each wait for their own `production` approval, so the
  # irreversible npm publish is approved last.

  docker:
    name: 'Release: Publish image'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [verify, test, build, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'auzroz/ynab-mcp'
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: release-dist

      - name: Verify release files
        working-directory: release-dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      # No build cache: the published image is built from the tagged source only.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

      # actions/attest is the documented replacement for actions/attest-sbom,
      # which is deprecated and now only wraps it.
      # This signed SBOM lists the application's production npm dependencies
      # (from package-lock.json), not the image's Alpine packages or the Node
      # runtime. Those are in the unsigned BuildKit SBOM from `sbom: true`.
      - name: Attest image application-dependency SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: release-dist/ynab-mcp-${{ env.VERSION }}.spdx.json
          push-to-registry: true
          create-storage-record: false

  npm-publish:
    name: 'Release: Publish npm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, build, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'auzroz/ynab-mcp'
    # The npm trusted publisher for ynab-mcp names release.yml and this
    # environment.
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    # No checkout and no install: this job publishes the tarball the build job
    # packed and runs no code from the dependency tree.
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: release-dist

      - name: Verify release files
        working-directory: release-dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1 and id-token: write.
      # Node 24 bundles a new enough npm; fail loudly rather than publish with an old one.
      - name: Assert npm supports trusted publishing
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);const ok=a>11||(a===11&&(b>5||(b===5&&c>=1)));if(!ok){console.error('::error::npm '+process.argv[1]+' is older than 11.5.1 (required for trusted publishing)');process.exit(1);}" "$(npm --version)"

      # One provenance attestation whose subjects are every file in SHA256SUMS:
      # the npm tarball, the SBOM and the skills zips.
      - name: Attest release files provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-dist/SHA256SUMS

      - name: Attest npm tarball SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-dist/ynab-mcp-${{ env.VERSION }}.tgz
          sbom-path: release-dist/ynab-mcp-${{ env.VERSION }}.spdx.json

      # No NODE_AUTH_TOKEN: npm exchanges the job's OIDC token with the trusted
      # publisher configured for this workflow on npmjs.com and attaches
      # provenance. Outside auzroz/ynab-mcp (the scratch-repo rehearsal, which
      # edits the job guards) the publish is a dry run.
      - name: Publish to npm
        env:
          # The leading ./ matters: npm reads "dir/file.tgz" as a GitHub owner/repo shorthand.
          TARBALL: ./release-dist/ynab-mcp-${{ env.VERSION }}.tgz
        run: |
          set -euo pipefail
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          if [ "$GITHUB_REPOSITORY" = "auzroz/ynab-mcp" ]; then
            npm publish "$TARBALL" --provenance --access public --tag "$dist_tag" --ignore-scripts
          else
            echo "::notice::$GITHUB_REPOSITORY is not auzroz/ynab-mcp, so npm publish runs as a dry run."
            npm publish "$TARBALL" --dry-run --access public --tag "$dist_tag" --ignore-scripts
          fi

  # Opt-in: claiming the io.github.auzroz namespace is the maintainer's decision.
  # Enable by setting the repository variable PUBLISH_MCP_REGISTRY=true.
  # Nothing else depends on this job, so a registry failure never blocks the GitHub release.
  mcp-registry:
    name: 'Release: MCP Registry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [npm-publish, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'auzroz/ynab-mcp' && vars.PUBLISH_MCP_REGISTRY == 'true'
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
      # sha256 of mcp-publisher_linux_amd64.tar.gz for the pinned version
      MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output checksums.txt "$base_url/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          # Must match both the hash pinned here and the checksum file published with the release.
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict -
          # Exact filename match: the file also lists "${archive}.sbom.json", which is not downloaded.
          entry="$(awk -v f="$archive" '$2 == f' checksums.txt)"
          if [ "$(printf '%s\n' "$entry" | grep -c .)" -ne 1 ]; then
            echo "expected exactly one checksum entry for ${archive}" >&2
            exit 1
          fi
          printf '%s\n' "$entry" | sha256sum --check --strict -
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish server.json

  github-release:
    name: 'Release: GitHub release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, docker, npm-publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'auzroz/ynab-mcp'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: release-dist

      - name: Verify release files
        working-directory: release-dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-') }}
          files: release-dist/*
          body: |
            ## Installation

            ### npm
            ```bash
            npx -y ynab-mcp
            # or install globally
            npm install -g ynab-mcp@${{ env.VERSION }}
            ```

            ### Docker
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            docker run -e YNAB_ACCESS_TOKEN=your_token ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ```

            ### Claude Desktop
            Add to your Claude Desktop config:
            ```json
            {
              "mcpServers": {
                "ynab": {
                  "command": "npx",
                  "args": ["-y", "ynab-mcp"],
                  "env": { "YNAB_ACCESS_TOKEN": "your_token" }
                }
              }
            }
            ```

            ### Skills

            This release also attaches a standalone [YNAB best-practices skills
            library](https://github.com/${{ github.repository }}/tree/main/skills) —
            15 Claude Agent Skills, downloadable below (`ynab-mcp-skills-v${{ env.VERSION }}.zip`
