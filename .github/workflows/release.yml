name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify server.json versions match tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "const s=require('./server.json');const t=process.argv[1];const bad=[];if(s.version!==t)bad.push('version '+s.version);for(const p of s.packages||[]){const v=p.registryType==='oci'?String(p.identifier).split(':').pop():p.version;if(v!==t)bad.push(p.registryType+' '+v);}if(bad.length){console.error('::error::server.json differs from tag '+t+': '+bad.join(', '));process.exit(1);}" "$TAG"

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: npm Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Trusted publishing (OIDC) needs npm >= 11.5.1 and id-token: write.
      # Node 24 bundles a new enough npm; fail loudly rather than publish with an old one.
      - name: Assert npm supports trusted publishing
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);const ok=a>11||(a===11&&(b>5||(b===5&&c>=1)));if(!ok){console.error('::error::npm '+process.argv[1]+' is older than 11.5.1 (required for trusted publishing)');process.exit(1);}" "$(npm --version)"

      # No NODE_AUTH_TOKEN: npm exchanges the job's OIDC token with the trusted
      # publisher configured for this workflow on npmjs.com (first used by v0.3.5)
      # and attaches provenance automatically.
      - name: Publish to npm
        run: npm publish --provenance --access public

  # Opt-in: claiming the io.github.auzroz namespace is the maintainer's decision.
  # Enable by setting the repository variable PUBLISH_MCP_REGISTRY=true.
  # Nothing else depends on this job, so a registry failure never blocks the GitHub release.
  mcp-registry:
    name: MCP Registry Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [npm, docker]
    if: ${{ vars.PUBLISH_MCP_REGISTRY == 'true' }}
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
      # sha256 of mcp-publisher_linux_amd64.tar.gz for the pinned version
      MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output checksums.txt "$base_url/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          # Must match both the hash pinned here and the checksum file published with the release.
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict -
          # Exact filename match: the file also lists "${archive}.sbom.json", which is not downloaded.
          entry="$(awk -v f="$archive" '$2 == f' checksums.txt)"
          if [ "$(printf '%s\n' "$entry" | grep -c .)" -ne 1 ]; then
            echo "expected exactly one checksum entry for ${archive}" >&2
            exit 1
          fi
          printf '%s\n' "$entry" | sha256sum --check --strict -
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish server.json

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker, npm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Package skills for distribution
        run: |
          mkdir -p skills-dist
          cd skills
          # One bundle with every skill folder at the top level (no wrapper dir),
          # for dropping straight into a skills directory.
          zip -r "../skills-dist/ynab-mcp-skills-v${{ steps.version.outputs.version }}.zip" . -x 'README.md' -x '*.DS_Store'
          # One zip per skill, for Claude.ai's one-at-a-time upload flow.
          for dir in */; do
            name="$(basename "$dir")"
            zip -r "../skills-dist/${name}.zip" "${name}" -x '*.DS_Store'
          done
          cd ..
          ls -la skills-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: skills-dist/*.zip
          body: |
            ## Installation

            ### npm
            ```bash
            npx -y ynab-mcp
            # or install globally
            npm install -g ynab-mcp@${{ steps.version.outputs.version }}
            ```

            ### Docker
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            docker run -e YNAB_ACCESS_TOKEN=your_token ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            ### Claude Desktop
            Add to your Claude Desktop config:
            ```json
            {
              "mcpServers": {
                "ynab": {
                  "command": "npx",
                  "args": ["-y", "ynab-mcp"],
                  "env": { "YNAB_ACCESS_TOKEN": "your_token" }
                }
              }
            }
            ```

            ### Skills

            This release also attaches a standalone [YNAB best-practices skills
            library](https://github.com/${{ github.repository }}/tree/main/skills) —
            15 Claude Agent Skills, downloadable below (`ynab-mcp-skills-v${{ steps.version.outputs.version }}.zip`
            for the full bundle, or grab an individual skill's zip). Install via
            Claude.ai → Settings → Capabilities → Skills → Upload skill, or drop
            into a Claude Code skills directory. See
            [skills/README.md](https://github.com/${{ github.repository }}/blob/main/skills/README.md)
            for details — 7 work with this MCP server connected, 8 work standalone.
