version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # During the 0.5.0 cycle, version-update PRs go to the release branch.
    # Security-update PRs still open against main: apply each fix to
    # release/0.5.0 too. Remove target-branch when 0.5.0 merges to main.
    target-branch: release/0.5.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vitest and its coverage provider must stay on the same version.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      # The MCP SDK v2 packages bump together, so core stays one version.
      mcp-sdk:
        patterns:
          - '@modelcontextprotocol/*'
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps are planned manually (0.4.0 and later).
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        versions: ['>=6.1.0']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: better-sqlite3
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ynab is pinned to ~5.0.0 on purpose; update manually.
      - dependency-name: ynab
        # Minor and major are planned by hand; patch and security PRs still flow.
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # server-legacy is pinned ~2.4.0 (ADR-0001 D14) and core must resolve to one version.
      - dependency-name: '@modelcontextprotocol/*'
        # Minor and major are planned by hand; patch and security PRs still flow.
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    # During the 0.5.0 cycle, version-update PRs go to the release branch.
    # Security-update PRs still open against main: apply each fix to
    # release/0.5.0 too. Remove target-branch when 0.5.0 merges to main.
    target-branch: release/0.5.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    # During the 0.5.0 cycle, version-update PRs go to the release branch.
    # Security-update PRs still open against main: apply each fix to
    # release/0.5.0 too. Remove target-branch when 0.5.0 merges to main.
    target-branch: release/0.5.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node base image major moves with the engines floor (0.4.0).
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
